# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A second push supersedes the first, so the older run has nothing left to
# tell us. Safe here because no job deploys anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # The whole job takes about ten seconds. A minute of grace is plenty,
    # and a hung runner stops before it burns the default six hours.
    timeout-minutes: 10
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be moved,
      # and then CI runs whatever it points at that day. Dependabot
      # bumps these, which is the half that keeps pins from rotting.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks resolves a commit range, which the default
          # single-commit checkout cannot provide. It scans the commits a
          # PR adds, not all history, so a secret already in history would
          # not be caught -- fine here, since every commit this repository
          # has was scanned by the PR run that added it.
          fetch-depth: 0

      - name: Install linters
        run: pip install -r requirements-ci.txt

      - name: Shell scripts
        run: shellcheck .claude/hooks/*.sh

      # Parsing a workflow proves only that it is YAML. actionlint reads
      # it as a workflow: unknown keys, an invalid `uses:`, a typo in a
      # ${{ }} expression, and (through shellcheck) bugs in `run:` blocks.
      - name: Workflow lint
        run: actionlint

      # Everything actionlint does not cover: .yaml as well as .yml, and
      # YAML outside .github/, which is where a compose file or a device
      # config will land.
      - name: YAML validity
        run: python3 scripts/check_yaml.py

      - name: ADRs and doc links
        run: python3 scripts/check_docs.py

      # CLAUDE.md has required an SPDX header on every source file since
      # the first commit, and nothing checked it until now. The licence is
      # the point of an AGPL project.
      - name: SPDX headers
        run: python3 scripts/check_spdx.py

      # Free for personal accounts and public repositories. A GitHub
      # Organization needs GITLEAKS_LICENSE, so this step is the one to
      # revisit if Skyline ever moves under an org.
      #
      # Pull requests only. On a push to main the action builds its range
      # with `git log --no-merges --first-parent`, and every commit on
      # main's first-parent line is a merge commit, so the range came out
      # empty: the step reported "0 commits scanned" and passed anyway.
      # The pull_request run is the gate, and it scans every commit as it
      # lands.
      #
      # The empty range is a consequence of merging with merge commits.
      # Turn on squash merging and main's first-parent line fills with
      # real commits, at which point a scan on push would start doing
      # work. See docs/adr/0007-secret-scan-on-pull-requests-only.md.
      - name: Secret scan
        if: github.event_name == 'pull_request'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
