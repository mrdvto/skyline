name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, which needs more than the default
          # single commit.
          fetch-depth: 0

      - name: Shell scripts
        run: shellcheck .claude/hooks/*.sh

      - name: Workflow and template YAML
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in glob.glob('.github/**/*.yml', recursive=True):
              try:
                  yaml.safe_load(open(f))
              except Exception as e:
                  print(f'error: {f}: {e}', file=sys.stderr)
                  bad += 1
          print(f"{'FAIL' if bad else 'ok'}: {bad} invalid file(s)")
          sys.exit(1 if bad else 0)
          PY

      - name: ADRs and doc links
        run: python3 scripts/check_docs.py

      # Free for personal accounts and public repositories. A GitHub
      # Organization needs GITLEAKS_LICENSE, so this step is the one to
      # revisit if Skyline ever moves under an org.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
